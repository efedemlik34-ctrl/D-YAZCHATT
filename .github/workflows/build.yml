name: Satin Almasiz APK Derleme ve Yukleme
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Proje Iskeletini Kur ve Satin Almayi Iptal Et
        run: |
          # 1. Klasör mimarisini hazırla
          mkdir -p app/src/main/java app/src/main/res
          echo "include ':app'" > settings.gradle

          # 2. Settings.gradle depo tanımları
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OtomatikAndroidProjesi"
          include ':app'
          EOF

          # 3. Ana build.gradle
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          # 4. App build.gradle (Satin alma kutuphanesini haric tutar)
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.otomatikuygulama'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.otomatikuygulama"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          # 5. Java kodlarini tasi ve premium moduna zorla
          find . -maxdepth 5 -path "*/java/*" -o -path "*/sources/*" | while read -r dosya; do
              if [ -f "$dosya" ] && [[ "$dosya" == *java ]]; then
                  # Kod icindeki satin alma kontrollerini etkisizlestir
                  sed -i 's/billingClient/System.out.println/g' "$dosya" || true
                  sed -i 's/launchBillingFlow/toString/g' "$dosya" || true
                  
                  PAKET_SATIRI=$(grep -E "^package " "$dosya" | head -n 1 || true)
                  if [ -n "$PAKET_SATIRI" ]; then
                      PAKET_YOLU=$(echo "$PAKET_SATIRI" | sed 's/package //' | sed 's/;//' | tr '.' '/' | tr -d '\r' | xargs)
                      mkdir -p "app/src/main/java/$PAKET_YOLU"
                      cp "$dosya" "app/src/main/java/$PAKET_YOLU/"
                  fi
              fi
          done

          # 6. Res ve Manifest dosyalarini tasi
          find . -maxdepth 5 -type d -name "res" -exec cp -r {}/* app/src/main/res/ \; 2>/dev/null || true
          MANIFEST_YOLU=$(find . -name "AndroidManifest.xml" ! -path "*/app/*" | head -n 1)
          if [ -n "$MANIFEST_YOLU" ]; then cp "$MANIFEST_YOLU" app/src/main/AndroidManifest.xml; fi

      - name: APK Derlemesini Baslat
        run: gradle assembleDebug --project-dir .

      - name: APK Dosyasini Bul ve Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Satin-Almasiz-Yeni-APK
          # Wildcard kullanarak APK dosyasini nerede olursa olsun bulmasini sagliyoruz
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
