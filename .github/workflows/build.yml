name: Otomatik Proje Iskeleti ve APK Derleme
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Yapıyı Kur ve Kaynakları Taşı
        run: |
          # 1. Standart Android klasör mimarisini inşa ediyoruz
          mkdir -p app/src/main/java app/src/main/res
          
          # 2. settings.gradle dosyasını eklenti depolarını (pluginManagement) içerecek şekilde sıfırdan yazıyoruz
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OtomatikAndroidProjesi"
          include ':app'
          EOF

          # 3. Ana build.gradle dosyasını basitleştiriyoruz (Eklenti yönetimi artık settings.gradle tarafında doğrulanacak)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 4. app/build.gradle (Uygulama ayarları ve kütüphaneler) oluşturuluyor
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.otomatikuygulama'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.otomatikuygulama"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          echo "=== DOSYALAR TAŞINIYOR ==="
          # Java kaynak kodlarını tarayıp orijinal paket yollarına göre diziyoruz
          find . -maxdepth 5 -path "*/java/*" -o -path "*/sources/*" | while read -r dosya; do
              if [ -f "$dosya" ] && [[ "$dosya" == *.java ]]; then
                  PAKET_SATIRI=$(grep -E "^package " "$dosya" | head -n 1 || true)
                  if [ -n "$PAKET_SATIRI" ]; then
                      PAKET_YOLU=$(echo "$PAKET_SATIRI" | sed 's/package //' | sed 's/;//' | tr '.' '/' | tr -d '\r' | xargs)
                      mkdir -p "app/src/main/java/$PAKET_YOLU"
                      cp "$dosya" "app/src/main/java/$PAKET_YOLU/"
                  fi
              fi
          done

          # Res (görsel ve XML arayüz) klasörlerini taşıyoruz
          find . -maxdepth 5 -type d -name "res" | while read -r res_dizin; do
              cp -r "$res_dizin"/* app/src/main/res/ 2>/dev/null || true
          done

          # Orijinal Manifest dosyasını koruyoruz, yoksa temel şablon yazıyoruz
          MANIFEST_YOLU=$(find . -name "AndroidManifest.xml" ! -path "*/app/*" | head -n 1)
          if [ -n "$MANIFEST_YOLU" ]; then
              cp "$MANIFEST_YOLU" app/src/main/AndroidManifest.xml
          else
              cat << 'EOF' > app/src/main/AndroidManifest.xml
              <manifest xmlns:android="http://android.com">
                  <application
                      android:allowBackup="true"
                      android:label="Otomatik Uygulama"
                      android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                      <activity android:name=".MainActivity" android:exported="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          EOF
          fi

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version: '17'

      - name: APK Derlemesini Başlat
        run: |
          gradle assembleDebug --project-dir .

      - name: Üretilen APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with: 
          name: 'Uretilen-APK'
          path: 'app/build/outputs/apk/debug/*.apk'
          
