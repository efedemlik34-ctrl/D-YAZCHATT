name: Satin Almasiz Kesin APK Derleme
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Projeyi Satin Almasiz Iskelete Oturt
        run: |
          # 1. Standart klasörleri açıyoruz
          mkdir -p app/src/main/java app/src/main/res
          
          # 2. Ayar dosyasını yazıyoruz
          echo "include ':app'" > settings.gradle

          # 3. Ana yönetim dosyasını yazıyoruz
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          # 4. KÖKTEN ÇÖZÜM: Buradaki listeye ASLA faturalandırma (billing) kütüphanesini EKLEMİYORUZ.
          # Böylece uygulama içindeki satın alma kodları tamamen hükümsüz kalıyor.
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.otomatikuygulama'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.otomatikuygulama"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          echo "=== KODLAR PREMIUM MODUNA ALINIYOR ==="
          # Java kaynak kodlarını tarayıp klasörlerine yerleştiriyoruz
          find . -maxdepth 5 -path "*/java/*" -o -path "*/sources/*" | while read -r dosya; do
              if [ -f "$dosya" ] && [[ "$dosya" == *.java ]]; then
                  
                  # KOD SEVİYESİNDE MÜDAHALE:
                  # Kodların içinde geçen satın alma (billing) isteklerini veya kilit mekanizmalarını 
                  # otomatik olarak etkisiz hale getirecek küçük kelime temizlikleri yapıyoruz.
                  sed -i 's/billingClient/System.out.println/g' "$dosya" 2>/dev/null || true
                  sed -i 's/launchBillingFlow/toString/g' "$dosya" 2>/dev/null || true
                  
                  PAKET_SATIRI=$(grep -E "^package " "$dosya" | head -n 1 || true)
                  if [ -n "$PAKET_SATIRI" ]; then
                      PAKET_YOLU=$(echo "$PAKET_SATIRI" | sed 's/package //' | sed 's/;//' | tr '.' '/' | tr -d '\r' | xargs)
                      mkdir -p "app/src/main/java/$PAKET_YOLU"
                      cp "$dosya" "app/src/main/java/$PAKET_YOLU/"
                  fi
              fi
          done

          # Tasarımları taşıyoruz
          find . -maxdepth 5 -type d -name "res" | while read -r res_dizin; do
              cp -r "$res_dizin"/* app/src/main/res/ 2>/dev/null || true
          done

          # Arayüz tasarımlarındaki (XML) reklam veya satın alma buton alanlarını devre dışı bırakıyoruz
          find app/src/main/res/layout/ -name "*.xml" | while read -r xml_dosya; do
              sed -i 's/android:visibility="visible"/android:visibility="gone"/g' "$xml_dosya" 2>/dev/null || true
          done

          # Temel Manifest dosyasını yazıyoruz (Satın alma izinlerini tamamen sildik)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com">
              <application
                  android:allowBackup="true"
                  android:label="Satın Almasız Uygulama"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: APK Derlemesini Başlat
        run: |
          # Projeyi hata vermeden doğrudan APK'ya dönüştürmeye zorluyoruz
          gradle assembleDebug --project-dir . || echo "Derleme tamamlanamadı ama log üretildi."

      - name: Satın Almasız APK'yı Dışarı Aktar
        uses: actions/upload-artifact@v4
        with: 
          name: 'Satin-Almasiz-Yeni-APK'
          path: 'app/build/outputs/apk/debug/*.apk'
          if-no-files-found: warn
          
