name: Satin Almasiz Kesin APK Derleme ve Yukleme
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Proje Iskeletini Kur ve Satin Almayi Iptal Et
        run: |
          # 1. Klasör mimarisini tertemiz hazırla
          mkdir -p app/src/main/java app/src/main/res
          echo "include ':app'" > settings.gradle

          # 2. AndroidX desteğini aktif et
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          EOF

          # 3. Settings.gradle yapılandırması
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OtomatikAndroidProjesi"
          include ':app'
          EOF

          # 4. Ana build.gradle
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          # 5. App build.gradle (Satin alma kutuphanesiz temel yapı)
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.otomatikuygulama'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.otomatikuygulama"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          # 6. Java kodlarini tasi ve premium moduna zorla
          find . -maxdepth 5 -path "*/java/*" -o -path "*/sources/*" | while read -r dosya; do
              if [ -f "$dosya" ] && [[ "$dosya" == *java ]]; then
                  sed -i 's/billingClient/System.out.println/g' "$dosya" || true
                  sed -i 's/launchBillingFlow/toString/g' "$dosya" || true
                  
                  PAKET_SATIRI=$(grep -E "^package " "$dosya" | head -n 1 || true)
                  if [ -n "$PAKET_SATIRI" ]; then
                      PAKET_YOLU=$(echo "$PAKET_SATIRI" | sed 's/package //' | sed 's/;//' | tr '.' '/' | tr -d '\r' | xargs)
                      mkdir -p "app/src/main/java/$PAKET_YOLU"
                      cp "$dosya" "app/src/main/java/$PAKET_YOLU/"
                  fi
              fi
          done

          # 7. Res (Arayüz) dosyalarını taşı
          find . -maxdepth 5 -type d -name "res" | while read -r res_dizin; do
              if [[ "$res_dizin" != *"app/src/main"* ]]; then
                  cp -r "$res_dizin"/* app/src/main/res/ 2>/dev/null || true
              fi
          done

          # 8. MANİFEST ÇAKIŞMASINI ÇÖZME: Depodaki orijinal Manifest dosyasını bul ve temizce taşı
          # Yapay zeka tarafından sonradan üretilen sahte manifestlerin oluşmasını tamamen engelliyoruz
          MANIFEST_YOLU=$(find . -name "AndroidManifest.xml" ! -path "*/app/*" | head -n 1)
          if [ -n "$MANIFEST_YOLU" ]; then
              cp "$MANIFEST_YOLU" app/src/main/AndroidManifest.xml
              echo "Orijinal Manifest başarıyla taşındı: $MANIFEST_YOLU"
          else
              # Eğer hiç manifest yoksa, hata vermemesi için en temel şablonu oluştur
              cat << 'EOF' > app/src/main/AndroidManifest.xml
              <manifest xmlns:android="http://android.com">
                  <application android:allowBackup="true" android:label="Uygulama" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                      <activity android:name="com.example.otomatikuygulama.MainActivity" android:exported="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          EOF
          fi

      - name: APK Derlemesini Baslat
        run: gradle assembleDebug --project-dir .

      - name: APK Dosyasini Bul ve Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Satin-Almasiz-Yeni-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
