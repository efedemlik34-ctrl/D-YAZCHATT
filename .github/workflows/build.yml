name: Otomatik Proje Iskeleti ve APK Derleme
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Yapıyı Kur ve Kaynakları Taşı
        run: |
          mkdir -p app/src/main/java app/src/main/res
          echo "include ':app'" > settings.gradle
          # Temel build.gradle dosyalarını oluştur (Android Gradle Plugin 8.2.0)
          echo 'buildscript { repositories { google(); mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:8.2.0" } }' > build.gradle
          echo 'allprojects { repositories { google(); mavenCentral() } }' >> build.gradle
          echo "apply plugin: 'com.android.application'
          android {
              compileSdk 34
              namespace 'com.example.app'
              defaultConfig { minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
          }" > app/build.gradle
          # Dosyaları taşı (kaynak klasörünüzü kontrol edin)
          cp -r kaynak/java/* app/src/main/java/ 2>/dev/null || true
          cp -r kaynak/res/* app/src/main/res/ 2>/dev/null || true
          cp kaynak/AndroidManifest.xml app/src/main/ 2>/dev/null || true

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: APK Derle
        run: gradle assembleDebug --project-dir .

      - name: APK Yükle
        uses: actions/upload-artifact@v4
        with: { name: 'Uretilen-APK', path: 'app/build/outputs/apk/debug/*.apk' }
        
