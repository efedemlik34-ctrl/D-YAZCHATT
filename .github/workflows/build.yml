name: Standart APK Derleme ve Yukleme
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Proje Iskeletini Kur ve Kaynaklari Temizle
        run: |
          # 1. Ana klasör mimarisini sıfırdan hazırlıyoruz
          mkdir -p app/src/main/java app/src/main/res
          echo "include ':app'" > settings.gradle

          # 2. AndroidX ve Jetifier desteğini aktif ediyoruz
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          EOF

          # 3. Settings.gradle yapılandırması
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OtomatikAndroidProjesi"
          include ':app'
          EOF

          # 4. Ana build.gradle
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          # 5. App build.gradle (Standart kütüphane yapılandırması)
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.otomatikuygulama'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.otomatikuygulama"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              // Çakışma üreten ExoPlayer dosyaları yerine resmi kütüphaneyi ekliyoruz
              implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
          }
          EOF

          echo "=== 1. JAVA KODLARI AKTARILIYOR ==="
          find . -maxdepth 5 -path "*/java/*" -o -path "*/sources/*" | while read -r dosya; do
              if [ -f "$dosya" ] && [[ "$dosya" == *java ]]; then
                  PAKET_SATIRI=$(grep -E "^package " "$dosya" | head -n 1 || true)
                  if [ -n "$PAKET_SATIRI" ]; then
                      PAKET_YOLU=$(echo "$PAKET_SATIRI" | sed 's/package //' | sed 's/;//' | tr '.' '/' | tr -d '\r' | xargs)
                      mkdir -p "app/src/main/java/$PAKET_YOLU"
                      cp "$dosya" "app/src/main/java/$PAKET_YOLU/"
                  fi
              fi
          done

          echo "=== 2. TÜM GÖRSEL VE XML KAYNAKLARI TEMİZLENİYOR ==="
          find . -maxdepth 6 -type f -name "*.xml" ! -name "build.gradle" ! -name "AndroidManifest.xml" ! -path "*/app/*" | while read -r dosya; do
              dosya_adi=$(basename "$dosya")
              klasor_adi=$(basename "$(dirname "$dosya")")
              
              # ExoPlayer ve Google kütüphanelerine ait çakışan sistem artıklarını engelliyoruz
              if [[ "$dosya_adi" == *\$* ]] || \
                 [[ "$dosya_adi" == abc_* ]] || \
                 [[ "$dosya_adi" == mtrl_* ]] || \
                 [[ "$dosya_adi" == btn_* ]] || \
                 [[ "$dosya_adi" == exo_* ]] || \
                 [[ "$dosya_adi" == common_* ]] || \
                 [[ "$dosya_adi" == google_* ]] || \
                 [[ "$dosya_adi" == design_* ]] || \
                 [[ "$dosya_adi" == notification_* ]]; then
                  echo "Kütüphane artığı elendi: $klasor_adi/$dosya_adi"
              else
                  mkdir -p "app/src/main/res/$klasor_adi"
                  temiz_ad=$(echo "$dosya_adi" | tr 'A-Z' 'a-z')
                  
                  # BOM (Görünmez karakter) hatasını engellemek için dosyayı saf UTF-8 olarak temizleyip kopyalıyoruz
                  sed '1s/^\xEF\xBB\xBF//' "$dosya" > "app/src/main/res/$klasor_adi/$temiz_ad" || true
              fi
          done

          echo "=== 3. MANİFEST YERLEŞTİRİLİYOR ==="
          MANIFEST_YOLU=$(find . -name "AndroidManifest.xml" ! -path "*/app/*" | head -n 1)
          if [ -n "$MANIFEST_YOLU" ]; then
              cp "$MANIFEST_YOLU" app/src/main/AndroidManifest.xml
          else
              cat << 'EOF' > app/src/main/AndroidManifest.xml
              <manifest xmlns:android="http://android.com">
                  <application android:allowBackup="true" android:label="Uygulama" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                      <activity android:name="com.example.otomatikuygulama.MainActivity" android:exported="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                  </application>
              </manifest>
          EOF
          fi

      - name: APK Derlemesini Baslat
        run: gradle assembleDebug --project-dir .

      - name: APK Dosyasini Bul ve Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Temiz-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
