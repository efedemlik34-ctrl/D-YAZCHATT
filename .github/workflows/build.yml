name: Bozuk Kaynaklari Temizle ve Standart APK Derle
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Proje Iskeletini Kur ve Bozuk XML Dosyalarini Otomatik Sil
        run: |
          # 1. Standart klasör mimarisini hazırlıyoruz
          mkdir -p app/src/main/java app/src/main/res
          echo "include ':app'" > settings.gradle

          # 2. AndroidX yapılandırması
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          EOF

          # 3. Settings.gradle yapılandırması
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OtomatikAndroidProjesi"
          include ':app'
          EOF

          # 4. Ana build.gradle
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          # 5. App build.gradle (Standart Android yapılandırması)
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.otomatikuygulama'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.otomatikuygulama"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          # 6. Java kodlarını paket adlarına göre yerleştir
          find . -maxdepth 5 -path "*/java/*" -o -path "*/sources/*" | while read -r dosya; do
              if [ -f "$dosya" ] && [[ "$dosya" == *java ]]; then
                  PAKET_SATIRI=$(grep -E "^package " "$dosya" | head -n 1 || true)
                  if [ -n "$PAKET_SATIRI" ]; then
                      PAKET_YOLU=$(echo "$PAKET_SATIRI" | sed 's/package //' | sed 's/;//' | tr '.' '/' | tr -d '\r' | xargs)
                      mkdir -p "app/src/main/java/$PAKET_YOLU"
                      cp "$dosya" "app/src/main/java/$PAKET_YOLU/"
                  fi
              fi
          done

          # 7. Res klasörlerini taşı
          find . -maxdepth 5 -type d -name "res" | while read -r res_dizin; do
              if [[ "$res_dizin" != *"app/src/main"* ]]; then
                  cp -r "$res_dizin"/* app/src/main/res/ 2>/dev/null || true
              fi
          done

          echo "=== AKILLI XML TARAMA VE TEMİZLEME MOTORU BAŞLADI ==="
          # Res klasöründeki tüm XML dosyalarını tek tek analiz ediyoruz
          find app/src/main/res/ -type f -name "*.xml" | while read -r xml_dosya; do
              # Dosyanın başındaki BOM veya kırık karakterleri temizleyip geçici dosyaya yazıyoruz
              iconv -f UTF-8 -t UTF-8//IGNORE -c "$xml_dosya" | sed '1s/^\xEF\xBB\xBF//' > temp.xml || true
              
              # Dosyanın ilk satırını okuyoruz
              ILK_SATIR=$(head -n 1 temp.xml | xargs || true)
              
              # KRİTİK KONTROL: Eğer dosya geçerli bir XML başlangıcı (<) içermiyorsa 
              # derleyiciyi çökertecek demektir. Bu dosyayı otomatik olarak siliyoruz.
              if [[ "$ILK_SATIR" != *"<"* ]]; then
                  echo "DOKUMAN FORMATI BOZUK - OTOMATIK SILINDI: $xml_dosya"
                  rm "$xml_dosya"
              else
                  # Dosya sağlamsa temizlenmiş halini üzerine yazıyoruz
                  mv temp.xml "$xml_dosya"
              fi
              rm -f temp.xml 2>/dev/null
          done

          # 8. Orijinal Manifest dosyasını taşı
          MANIFEST_YOLU=$(find . -name "AndroidManifest.xml" ! -path "*/app/*" | head -n 1)
          if [ -n "$MANIFEST_YOLU" ]; then cp "$MANIFEST_YOLU" app/src/main/AndroidManifest.xml; fi

      - name: APK Derlemesini Baslat
        run: gradle assembleDebug --project-dir .

      - name: Temizlenmis APK'yi Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Temizlenmis-Uygulama-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
